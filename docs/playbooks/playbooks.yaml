- id: PB-OUTPERFORM
  version: 1
  status: approved
  owner: Sales Operations
  approved_by: Regional Sales Director (demo)
  effective_from: 2014-06-01
  review_by: 2016-06-30
  title: Store beating forecast — find out why and copy it
  applies_when:
    direction: 1
  situation: Sales are well above forecast for one or more weeks.
  expected_impact: Not quantified.
  plays:
    - {step: "Split the gain into customer visits vs basket and document what changed locally", owner: Area manager, when: Week 1-2}
    - {step: "If the driver is repeatable (display, staffing, local partnership), pilot it in 2-3 similar stores", owner: Sales Operations, when: Weeks 3-8}
    - {step: "Raise the store's forecast if the gain persists for 4 weeks", owner: Decision Intelligence, when: Week 4}
  talking_points:
    - Great weeks are a lead to follow, not just a number to celebrate.
  measure: [Sales vs forecast in pilot stores vs comparable stores]
  do_not:
    - Do not roll out chain-wide before a controlled pilot.

