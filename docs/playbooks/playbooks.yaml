# Store response playbooks: the ONLY action guidance the copilot may retrieve.
#
# Authored for this portfolio project (not real Rossmann policy). Governance fields make
# retrieval trustworthy:
#   status          approved | draft | superseded  (only "approved" is ever retrieved)
#   effective_from / review_by   retrieval also requires as-of date within this window
#   applies_when    structured triggers matched against root-cause evidence
# {placeholders} are filled at retrieval time from reports/m3_competitor_impact.json, so
# quoted impacts always equal the latest causal analysis (and are fact-checkable).

- id: PB-COMP-NEAR
  version: 2
  status: approved
  owner: Sales Operations
  approved_by: Regional Sales Director (demo)
  effective_from: 2014-06-01
  review_by: 2016-06-30
  title: New competitor within 1 km — defend the catchment
  applies_when:
    root_cause: [competitor_opened]
    competitor_within_m: 1000
  situation: >
    A competitor opened within 1 km of the store in the last six months. Customer visits
    usually fall first; the drop is a lasting shift, not a one-off dip.
  expected_impact: >
    Internal causal analysis of {near_n} stores: weekly sales change {near_effect}
    (95% CI {near_lo} to {near_hi}) after a competitor opens within 1 km, with no
    meaningful recovery over six months.
  plays:
    - {step: "Price-perception check on the 50 highest-traffic items versus the new competitor; correct outliers only", owner: Store manager + Pricing, when: Weeks 1-2}
    - {step: "Retention offer to existing loyalty customers in the catchment", owner: CRM, when: Weeks 1-4}
    - {step: "Protect promo-week execution: full stock and peak-hour staffing on promo weeks", owner: Store manager, when: Ongoing}
    - {step: "Fix service gaps the competitor can exploit: checkout queues, opening-hours compliance", owner: Store manager, when: Weeks 1-4}
    - {step: "Re-baseline the store's forecast by the expected impact so anomaly alerts track performance against the new normal", owner: Decision Intelligence, when: Week 2}
  talking_points:
    - Expect fewer visits for a while; our job is to keep our regular customers, not to win a price war.
    - Every promo week counts double now: no empty shelves, no long queues.
  measure: [Customer visits vs forecast (weekly), Same-store YoY, Basket size; review at week 8]
  do_not:
    - Do not match competitor prices across the whole range.
    - Do not cut staffing hours in response to the initial dip.

